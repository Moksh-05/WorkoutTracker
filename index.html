<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121316">

  <!-- Self-hosted libraries so the app works with zero signal -->
  <script src="vendor/supabase.js"></script>
  <script src="vendor/chart.min.js"></script>
</head>
<body>

  <div class="top-row">
    <h1>Gym Tracker</h1>
    <span id="connection-indicator" class="badge">●</span>
  </div>

  <div id="status"></div>

  <button class="secondary small-btn" onclick="forceRefresh()">Force update app</button>

  <div class="tabs">
    <button onclick="showTab('log')" id="tab-log">Log</button>
    <button onclick="showTab('dashboard')" id="tab-dashboard">Dashboard</button>
    <button onclick="showTab('bodyweight')" id="tab-bodyweight">Body Weight</button>
  </div>

  <!-- LOG SCREEN -->
  <div id="log-screen" class="screen">

    <div class="card">
      <h2>Today's session</h2>

      <label>Date</label>
      <input type="date" id="log-date-input">

      <label>Workout split</label>
      <input type="text" id="day-label-input" placeholder="e.g. Shoulders, Biceps, Legs">

      <label>Calories burned</label>
      <input type="number" id="calories-burned-input" placeholder="Optional">

      <button class="secondary" onclick="logRestDay()">Log this date as a rest day</button>
    </div>

    <div class="card">
      <h2>Log a set</h2>

      <label>Exercise</label>
      <select id="exercise-select" onchange="onExerciseChange()"></select>

      <div id="custom-exercise-form" style="display:none;">
        <label>New exercise name</label>
        <input type="text" id="custom-exercise-name" placeholder="e.g. Cable Row">

        <label>Category</label>
        <select id="custom-exercise-category" onchange="onCustomCategoryChange()">
          <option value="resistance">Resistance (weight-based)</option>
          <option value="bodyweight">Bodyweight</option>
        </select>

        <div id="custom-subtype-field" style="display:none;">
          <label>Type</label>
          <select id="custom-exercise-subtype">
            <option value="reps">Reps (e.g. pull-ups)</option>
            <option value="timed_hold">Timed hold (e.g. dead hang, plank)</option>
          </select>
        </div>

        <label>Muscle group</label>
        <select id="custom-exercise-muscle-group">
          <option>Chest</option>
          <option>Back</option>
          <option>Shoulders</option>
          <option>Biceps</option>
          <option>Triceps</option>
          <option>Legs</option>
          <option>Core</option>
        </select>

        <button onclick="saveCustomExercise()">Save exercise</button>
      </div>

      <div id="target-display" class="conversion-hint"></div>

      <div id="resistance-fields">
        <label>Weight</label>
        <div class="unit-pair">
          <div>
            <input type="number" id="weight-input-lbs" oninput="syncWeight('lbs')">
            <div class="conversion-hint">lbs</div>
          </div>
          <div>
            <input type="number" id="weight-input-kg" oninput="syncWeight('kg')">
            <div class="conversion-hint">kg</div>
          </div>
        </div>

        <label>Reps</label>
        <input type="number" id="reps-input">
      </div>

      <div id="timed-fields" style="display:none;">
        <label>Duration (seconds)</label>
        <input type="number" id="duration-input">
      </div>

      <label>Side</label>
      <select id="side-select">
        <option value="both" selected>Both</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>

      <div class="toggle-row">
        <button type="button" id="warmup-toggle" class="toggle-btn" onclick="toggleFlag('warmup')">Warm-up</button>
        <button type="button" id="failure-toggle" class="toggle-btn" onclick="toggleFlag('failure')">Failure</button>
      </div>

      <label>Difficulty</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label>Rest time (seconds)</label>
      <input type="number" id="rest-time-input">

      <label>Notes</label>
      <textarea id="notes-input"></textarea>

      <button onclick="addSet()">Add set</button>
      <button class="secondary" onclick="repeatLastSet()">Repeat last set</button>
    </div>

    <div class="card">
      <h3>Today's sets</h3>
      <table id="todays-sets">
        <thead>
          <tr><th>Exercise</th><th>Weight/Duration</th><th>Reps</th><th>Flags</th></tr>
        </thead>
        <tbody id="todays-sets-body"></tbody>
      </table>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="screen" style="display:none;">

    <div class="card">
      <h2>This month</h2>
      <div id="calendar-container"></div>
      <div class="calendar-legend">
        <span><span class="legend-dot" style="background:var(--accent)"></span>Workout</span>
        <span><span class="legend-dot" style="background:#4a4d54"></span>Rest</span>
        <span><span class="legend-dot" style="border:1px dashed #5a3033"></span>Missed</span>
      </div>
    </div>

    <div class="card">
      <h2>Consistency</h2>
      <div class="stats-row" id="consistency-stats"></div>
    </div>

    <div class="card">
      <h2>Volume by muscle group</h2>
      <canvas id="muscle-group-chart" height="200"></canvas>
    </div>

    <div class="card">
      <h2>Strength progress</h2>
      <select id="dashboard-exercise-select" onchange="renderStrengthChart()"></select>
      <canvas id="strength-chart" height="200"></canvas>
    </div>

    <div class="card">
      <h2>Volume over time</h2>
      <canvas id="volume-chart" height="200"></canvas>
    </div>
  </div>

  <!-- BODY WEIGHT SCREEN -->
  <div id="bodyweight-screen" class="screen" style="display:none;">
    <div class="card">
      <h2>Log body weight</h2>
      <label>Weight</label>
      <div class="unit-pair">
        <div>
          <input type="number" id="bodyweight-input-lbs" oninput="syncBodyWeight('lbs')">
          <div class="conversion-hint">lbs</div>
        </div>
        <div>
          <input type="number" id="bodyweight-input-kg" oninput="syncBodyWeight('kg')">
          <div class="conversion-hint">kg</div>
        </div>
      </div>
      <button onclick="logBodyWeight()">Save</button>
    </div>

    <div class="card">
      <h2>Trend</h2>
      <canvas id="bodyweight-chart" height="200"></canvas>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
