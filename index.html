<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <!-- External libraries: Supabase for the database, Chart.js for graphs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>Gym Tracker</h1>

  <div id="status"></div>

  <!-- Tab buttons to switch between screens -->
  <div class="tabs">
    <button onclick="showTab('log')" id="tab-log">Log</button>
    <button onclick="showTab('dashboard')" id="tab-dashboard">Dashboard</button>
    <button onclick="showTab('bodyweight')" id="tab-bodyweight">Body Weight</button>
  </div>

  <!-- LOG SCREEN -->
  <div id="log-screen" class="screen">
    <h2>Log a Set</h2>

    <button id="rest-day-btn" onclick="logRestDay()">Log Today as Rest Day</button>

    <div id="unit-toggle">
      <button onclick="toggleUnit()">Switch to <span id="other-unit">kg</span></button>
    </div>

    <label>Exercise</label>
    <select id="exercise-select" onchange="onExerciseChange()"></select>

    <div id="target-display"></div>

    <div id="resistance-fields">
      <label>Weight (<span class="unit-label">lbs</span>)</label>
      <input type="number" id="weight-input">

      <label>Reps</label>
      <input type="number" id="reps-input">
    </div>

    <div id="timed-fields" style="display:none;">
      <label>Duration (seconds)</label>
      <input type="number" id="duration-input">
    </div>

    <label>Difficulty</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>

    <label>Rest time (seconds)</label>
    <input type="number" id="rest-time-input">

    <label>Notes</label>
    <textarea id="notes-input"></textarea>

    <button onclick="addSet()">Add Set</button>

    <h3>Today's Sets</h3>
    <table id="todays-sets">
      <thead>
        <tr><th>Exercise</th><th>Weight/Duration</th><th>Reps</th><th>Difficulty</th></tr>
      </thead>
      <tbody id="todays-sets-body"></tbody>
    </table>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="screen" style="display:none;">
    <h2>Dashboard</h2>

    <label>Select Exercise</label>
    <select id="dashboard-exercise-select" onchange="renderStrengthChart()"></select>

    <canvas id="strength-chart" height="200"></canvas>

    <h3>Volume Over Time</h3>
    <canvas id="volume-chart" height="200"></canvas>

    <h3>Consistency</h3>
    <div id="consistency-stats"></div>
  </div>

  <!-- BODY WEIGHT SCREEN -->
  <div id="bodyweight-screen" class="screen" style="display:none;">
    <h2>Body Weight</h2>

    <label>Weight (<span class="unit-label">lbs</span>)</label>
    <input type="number" id="bodyweight-input">
    <button onclick="logBodyWeight()">Save</button>

    <canvas id="bodyweight-chart" height="200"></canvas>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
